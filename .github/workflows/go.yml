name: Go checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: spot_scanner_test
          POSTGRES_USER: spot_test
          POSTGRES_PASSWORD: spot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spot_test -d spot_scanner_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_TEST_URL: postgres://spot_test:spot_test@localhost:5432/spot_scanner_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Download Go modules
        run: go mod download
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d ./cmd ./internal || true
            exit 1
          fi
      - name: Test (unit and PostgreSQL integration)
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
