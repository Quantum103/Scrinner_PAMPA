name: Go checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: rsi_scanner_test
          POSTGRES_USER: rsi_test
          POSTGRES_PASSWORD: rsi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsi_test -d rsi_scanner_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_TEST_URL: postgres://rsi_test:rsi_test@localhost:5432/rsi_scanner_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Download Go modules
        run: go mod download
      - name: Verify formatting
        run: |
          gofmt -d ./cmd ./internal
          test -z "$(gofmt -l ./cmd ./internal)"
      - name: Test (unit and PostgreSQL integration)
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Indicator benchmarks
        run: go test ./internal/indicators -run=^NoTestsWillMatch -bench=BenchmarkCalculate -benchmem -benchtime=1x
      - name: Scanner load benchmarks
        run: |
          go test ./internal/scanner -run=^NoTestsWillMatch -bench=BenchmarkPersonalizedScan -benchmem -benchtime=1x
          go test ./internal/scanner -run=^NoTestsWillMatch -bench=BenchmarkProfileRoutingCache -benchmem -benchtime=1x
      - name: Create isolated benchmark database
        run: |
          postgres_container="$(docker ps --filter "ancestor=postgres:18-alpine" --format "{{.ID}}" | head -n 1)"
          if [ -z "$postgres_container" ]; then
            echo "PostgreSQL service container was not found" >&2
            exit 1
          fi
          docker exec "$postgres_container" createdb -U rsi_test rsi_scanner_bench
      - name: PostgreSQL load benchmarks
        env:
          DATABASE_BENCH_URL: postgres://rsi_test:rsi_test@localhost:5432/rsi_scanner_bench?sslmode=disable
        run: |
          go test ./internal/storage -run=^NoTestsWillMatch -bench=BenchmarkListScannerWorkloads -benchmem -benchtime=1x
          go test ./internal/storage -run=^NoTestsWillMatch -bench=BenchmarkCommitScannerProfileCandleWithoutSignal -benchmem -benchtime=1x
