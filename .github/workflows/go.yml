name: Go checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: rsi_scanner_test
          POSTGRES_USER: rsi_test
          POSTGRES_PASSWORD: rsi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsi_test -d rsi_scanner_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_TEST_URL: postgres://rsi_test:rsi_test@localhost:5432/rsi_scanner_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Download Go modules
        run: go mod download
      - name: Diagnose formatting
        run: gofmt -l ./cmd ./internal
      - name: Show formatting diff
        run: gofmt -d ./cmd ./internal
      - name: Verify formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Test (unit and PostgreSQL integration)
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
